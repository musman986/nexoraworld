name: Update world news and publish site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch BBC World RSS
        run: |
          curl -L https://feeds.bbci.co.uk/news/world/rss.xml -o bbc.xml

      - name: Create news.json
        run: |
          python << 'EOF'
          import xml.etree.ElementTree as ET
          import json

          root = ET.parse("bbc.xml").getroot()

          news = []

          for item in root.findall(".//item")[:10]:
              news.append({
                  "title": item.findtext("title"),
                  "link": item.findtext("link"),
                  "date": item.findtext("pubDate")
              })

          with open("news.json","w",encoding="utf-8") as f:
              json.dump(news,f,ensure_ascii=False,indent=2)
          EOF

      - name: Commit news.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Auto update world news"
          git push
